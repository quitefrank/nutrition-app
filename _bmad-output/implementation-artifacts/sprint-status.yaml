    summary: >
      AC4 — ProcessingStrip announces state changes via aria-label mutation on the
      aria-live wrapper, not via text content change. Screen readers do not reliably
      announce aria-label mutations on live regions. Fix requires restructuring
      ProcessingStrip to put status text as DOM text content inside the aria-live
      element. Higher-lift change; deferred from Story 6.1 code review (2026-03-28).
    action: Address in Epic 6 retrospective — decide whether to fix in a 6.x story or carry to Epic 7.
